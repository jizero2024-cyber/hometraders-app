<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>납품 송장 · 홈트레이더스</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <!-- 전자 송장 (10/26 대표) — 받는 분이 휴대폰으로 품목 체크 + 서명. 로그인 없음, 우리 업무 앱 코드는 안 불러옴 -->
  <style>
    :root { --ink: #1F2328; --sub: #6B6B6B; --line: #E6E4DF; --or: #E8732C; --orl: #FDF0E6; --ok: #1E6B34; --bg: #F7F7F5; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, 'Noto Sans KR', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    * { box-sizing: border-box; }
    button, input { font-family: inherit; }
    .sj { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
    .sj-card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; }
    .sj-head { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
    .sj-head h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .02em; }
    .sj-head img { height: 34px; width: auto; }
    .sj-bar { height: 4px; border-radius: 2px; background: #F0B445; margin: 16px 0 14px; }
    .sj-to { font-size: 21px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
    .sj-meta { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 16px; line-height: 1.5; }
    .sj-meta span { color: var(--sub); }
    .sj-lh { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .sj-lh b { font-size: 19px; }
    .sj-lh .cnt { font-size: 15px; color: var(--sub); }
    .sj-lh .sp { flex: 1; }
    .sj-all { height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--or); background: #fff; color: var(--or); font-size: 15px; font-weight: 700; }
    .sj-items { display: flex; flex-direction: column; }
    .sj-it { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 66px; padding: 14px 4px; border: 0; border-top: 1px solid #EFEDE8; background: none; text-align: left; color: var(--ink); cursor: pointer; }
    .sj-it:first-child { border-top: 0; }
    .sj-ck { flex: 0 0 32px; height: 32px; border-radius: 16px; border: 2px solid #C9C6BF; display: flex; align-items: center; justify-content: center; background: #fff; transition: background .12s, border-color .12s; }
    .sj-it.on .sj-ck { background: var(--or); border-color: var(--or); }
    .sj-ck svg { width: 18px; height: 18px; opacity: 0; }
    .sj-it.on .sj-ck svg { opacity: 1; }
    .sj-nm { flex: 1; min-width: 0; font-size: 18px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
    .sj-nm small { display: block; font-size: 13px; color: var(--sub); }
    .sj-q { flex: 0 0 auto; font-size: 19px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sj-q small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 2px; }
    .sj-it.on .sj-nm { color: #3F3F46; }
    .sj-sign h2 { margin: 0 0 12px; font-size: 19px; }
    .sj-name { width: 100%; height: 54px; border: 1px solid #D0D0D0; border-radius: 12px; padding: 0 14px; font-size: 18px; background: #fff; color: var(--ink); }
    .sj-pad { position: relative; margin-top: 12px; height: 210px; border: 2px dashed #C9C6BF; border-radius: 14px; background: #fff; touch-action: none; overflow: hidden; }
    .sj-pad canvas { width: 100%; height: 100%; display: block; }
    .sj-pad .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #B8B5AE; font-size: 18px; pointer-events: none; }
    .sj-row { display: flex; gap: 10px; margin-top: 12px; }
    .sj-clear { height: 54px; padding: 0 18px; border-radius: 12px; border: 1px solid #D0D0D0; background: #fff; font-size: 16px; color: #3F3F46; }
    .sj-go { flex: 1; height: 54px; border: 0; border-radius: 12px; background: var(--or); color: #fff; font-size: 18px; font-weight: 800; }
    .sj-go:disabled { background: #E3DFD8; color: #9A968F; }
    .sj-msg { margin-top: 10px; font-size: 15px; color: #B42318; min-height: 20px; }
    .sj-done { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .sj-done .ok { font-size: 19px; font-weight: 800; color: var(--ok); }
    .sj-done img { width: 100%; max-height: 220px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
    .sj-done .who { font-size: 16px; color: var(--sub); }
    .sj-empty { padding: 60px 12px; text-align: center; font-size: 18px; color: var(--sub); }
  </style>
</head>
<body>
  <div id="app" class="sj"><div class="sj-empty">불러오는 중…</div></div>
  <script type="module" src="/js/songjang.js?v=2"></script>
</body>
</html>
