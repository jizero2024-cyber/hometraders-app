<!doctype html>
<html lang="ko">
<head>
  <script>   // 전자 송장 짧은 링크 /s/<코드 6자리> → 송장 페이지 (10/27, 우리 앱을 거치지 않음)
    (function () { var m = /^\/s\/([A-Za-z0-9]{6})\/?$/.exec(location.pathname); if (m) location.replace('/songjang/?k=' + m[1].toUpperCase()); })();
  </script>
  <!-- 404.html = index.html 과 같음 (+ base). /homt·/chat 같은 화면 주소로 바로 열면 GitHub Pages 가 이 파일을 보여 줘 앱이 그 화면으로 뜬다. index.html 을 고치면 같이 고칠 것 -->
  <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>홈트레이더스 재고·출고</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="홈트레이더스">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./css/app.css?v=7">
  <link rel="stylesheet" href="./css/erp.css">
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // 공간제작소 주소(/gonggan…)에서는 우리 업무 앱을 절대 실행하지 않음 — 옛 오프라인 저장본이 이 파일을 대신 보여 줘도 (10/25 대표 "딴 곳에서 홈트 도우미가 나온대")
    if (location.pathname.startsWith('/gonggan')) { document.title = '공간제작소 거래명세표 · 세금계산서'; import('/js/gonggan-app.js?v=55'); }
    else import('/js/app.js?v=19');
  </script>
</body>
</html>
