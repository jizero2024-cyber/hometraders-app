<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입금표 작성</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef0f3; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
         word-break: keep-all; overflow-wrap: break-word; color: #000; }
  .wrap { display: flex; gap: 24px; padding: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }

  /* 입력 패널 */
  .panel { background: #fff; border-radius: 12px; padding: 20px; width: 300px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .panel h2 { margin: 0 0 16px; font-size: 18px; }
  .panel label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  .panel input { width: 100%; font-size: 18px; padding: 10px 12px; border: 1px solid #ccd; border-radius: 8px; font-family: inherit; }
  .panel input#amount { font-size: 22px; font-weight: 700; text-align: right; }
  .hangul { margin-top: 6px; font-size: 13px; color: #1a56c4; min-height: 18px; text-align: right; }
  .warn { color: #c62828; }
  .btns { display: flex; gap: 8px; margin-top: 20px; }
  .btns button { flex: 1; font-size: 15px; font-weight: 700; padding: 12px 0; border: 0; border-radius: 8px;
                 cursor: pointer; text-align: center; font-family: inherit; }
  .b-print { background: #1f3a93; color: #fff; }
  .b-png { background: #e7ebf5; color: #1f3a93; }
  .drive { margin-top: 14px; font-size: 13px; line-height: 1.5; color: #555; min-height: 20px; }
  .drive.ok { color: #1f8b4c; }
  .drive.err { color: #c62828; }
  .drive a { color: inherit; font-weight: 700; }

  /* 입금표 양식 */
  .sheet { background: #fff; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #form { width: 552px; border: 2px solid #000; background: #fff; position: relative; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  td { border: 1px solid #000; text-align: center; vertical-align: middle; padding: 0; font-weight: 700; }
  .title { height: 122px; border-bottom: 2px solid #000; position: relative; }
  .title h1 { margin: 0; position: absolute; top: 22px; left: 0; right: 0; text-align: center;
              font-size: 34px; letter-spacing: 14px; font-weight: 800; }
  .title .to { position: absolute; right: 16px; bottom: 8px; font-size: 23px; font-weight: 400; }
  .title .logo { position: absolute; left: 14px; top: 12px; width: 120px; }
  .title .to b { font-weight: 800; margin-left: 10px; }

  .sup td { height: 41px; font-size: 14px; }
  .sup td.big { font-size: 20px; font-weight: 800; height: 58px; }
  .sup td.vlabel { font-size: 18px; line-height: 1.2; }
  .sup .lbl { font-size: 17px; }
  .sup tr:last-child td { border-bottom: 2px solid #000; }

  .amt td { font-size: 15px; height: 40px; }
  .amt td.h { font-size: 18px; height: 42px; }
  .amt td.small { font-size: 13px; }
  .amt td.d { font-size: 13px; }
  .amt td.date { font-size: 16px; text-align: right; padding-right: 6px; }
  .amt td.date span { display: inline-block; min-width: 40px; text-align: right; margin-right: 6px; font-weight: 800; }
  .amt td.dig { height: 80px; font-size: 22px; }

  .sum td { font-size: 15px; }
  .sum td.lbl { font-size: 20px; letter-spacing: 12px; padding-left: 12px; }
  .sum td.u { height: 30px; border-top: 0; border-bottom: 0; }
  .sum td.v { height: 48px; font-size: 24px; font-weight: 800; border-top: 0; }
  .sum tr:last-child td { border-bottom: 2px solid #000; }
  .sum, .amt { border-top: 2px solid #000; }

  .memo { position: relative; height: 196px; }
  .memo .line { position: absolute; left: 0; right: 0; border-top: 1px solid #000; }
  .memo .content { position: absolute; left: 6px; top: 12px; font-size: 15px; font-weight: 700; }
  .memo .content span { margin-left: 18px; font-weight: 400; }
  .memo .stamp { position: absolute; left: 222px; top: 10px; width: 215px; }
  .memo .seal { position: absolute; left: 424px; top: 2px; width: 118px; }
  .memo .rcv { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-weight: 700; font-size: 15px; padding-left: 300px; }

  @media (max-width: 640px) {
    .wrap { padding: 16px; }
    .sheet { overflow-x: auto; max-width: 100%; }
  }
  @media print {
    @page { size: A4 portrait; margin: 20mm; }
    body { background: #fff; }
    .panel { display: none; }
    .wrap { padding: 0; display: block; }
    .sheet { box-shadow: none; padding: 0; }
    #form { margin: 0 auto; zoom: 1.15; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>입금표 작성</h2>

    <label for="amount">금액 (원)</label>
    <input id="amount" inputmode="numeric" autocomplete="off" placeholder="3,762,000" autofocus>
    <div class="hangul" id="hangul"></div>

    <label for="date">작성일 (상계처리 날짜)</label>
    <input id="date" type="date">

    <label for="to">받는 곳</label>
    <input id="to" value="원익큐브">

    <label for="memo">내용</label>
    <input id="memo" value="상계처리">

    <div class="btns">
      <button class="b-print" onclick="issue('print')">인쇄 / PDF</button>
      <button class="b-png" onclick="issue('png')">그림 저장</button>
    </div>
    <div class="drive" id="drive">발행하면 구글 드라이브 입금표 폴더에도 저장돼요</div>
  </div>

  <div class="sheet">
    <div id="form">

</div>

<script>
  const $ = id => document.getElementById(id);

  function toHangul(n) {
    if (!n) return '';
    const d = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
    const u = ['', '십', '백', '천'];
    const big = ['', '만', '억'];
    let out = '', g = 0;
    while (n > 0) {
      const part = n % 10000;
      if (part) {
        let s = '', p = part;
        for (let i = 0; i < 4 && p; i++, p = Math.floor(p / 10)) {
          const k = p % 10;
          if (k) s = (k === 1 && i > 0 ? '' : d[k]) + u[i] + s;
        }
        out = s + big[g] + out;
      }
      n = Math.floor(n / 10000); g++;
    }
    return '일금 ' + out + '원정';
  }

  function render() {
    const raw = $('amount').value.replace(/[^0-9]/g, '');
    const n = raw ? parseInt(raw, 10) : 0;
    $('amount').value = n ? n.toLocaleString('ko-KR') : '';

    const cells = $('o-sum').children;
    const h = $('hangul');
    if (n > 99999999) {
      h.textContent = '합계 칸은 9,999만 9,999원까지만 들어갑니다';
      h.className = 'hangul warn';
      for (const c of cells) c.textContent = '';
    } else {
      h.textContent = toHangul(n);
      h.className = 'hangul';
      const s = n ? String(n) : '';
      for (let i = 0; i < 8; i++) {
        const j = s.length - 8 + i;
        cells[i].textContent = j >= 0 ? s[j] : '';
      }
    }

    const dv = $('date').value; // yyyy-mm-dd
    if (dv) {
      const [y, m, d] = dv.split('-');
      $('o-y').textContent = y; $('o-m').textContent = +m; $('o-d').textContent = +d;
    } else {
      $('o-y').textContent = ''; $('o-m').textContent = ''; $('o-d').textContent = '';
    }
    $('o-to').textContent = $('to').value;
    $('o-memo').textContent = $('memo').value;
  }

  ['amount', 'date', 'to', 'memo'].forEach(id => $(id).addEventListener('input', render));
  // 대화 화면에서 열 때 — 주소 뒤 ?amount=&date=&to=&memo= 로 칸을 채워서 연다
  (() => { const q = new URLSearchParams(location.search); ['amount', 'date', 'to', 'memo'].forEach((k) => { const v = q.get(k); if (v !== null && v !== '') $(k).value = k === 'amount' ? Number(v.replace(/[^\d]/g, '')).toLocaleString() : v; }); })();
  render();

  // 파일 이름 — 260810_원익큐브_입금표_3762000원
  function baseName() {
    const ymd = $('date').value.replace(/-/g, '').slice(2);
    const amt = $('amount').value.replace(/,/g, '');
    const to = $('to').value.replace(/[\\/:*?"<>|\s]/g, '') || '거래처';
    return `${ymd}_${to}_입금표_${amt}원`;
  }

  function ready() {
    if (!$('amount').value) { alert('금액을 넣어 주세요.'); $('amount').focus(); return false; }
    if (!$('date').value) { alert('작성일(상계처리 날짜)을 골라 주세요.'); $('date').focus(); return false; }
    return true;
  }

  async function capture() {
    if (!window.html2canvas) throw new Error('인터넷 연결이 필요해요');
    return html2canvas($('form'), { scale: 3, backgroundColor: '#ffffff' });
  }

  // 발행 = 인쇄(또는 그림 저장) + 드라이브 저장
  async function issue(how) {
    if (!ready()) return;
    if (how === 'print') {
      window.print();
      saveDrive();
    } else {
      try {
        const canvas = await capture();
        const a = document.createElement('a');
        a.download = baseName() + '.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        saveDrive(canvas);
      } catch (e) { say('err', '그림 저장 실패: ' + e.message); }
    }
  }

  // ── 구글 드라이브 저장 — 서류 전환 화면과 같은 저장 창구(Apps Script) ──
  //    입금표/<번호_거래처>/<작성일 연-월>/ 에 PNG·PDF. 같은 이름이면 예전 것은 휴지통으로(덮어쓰기).
  const DRIVE_KEY = 'ht_drive_endpoint';
  const DRIVE_DEFAULT = 'https://script.google.com/macros/s/AKfycbwO58PSbjeCicjpPa6ms7SyjAoKbQBMkWCASnIMY67Nq0HtYRjvpjN2TFQyJUzbWSlP/exec';
  function driveUrl() {
    try {
      const v = (localStorage.getItem(DRIVE_KEY) || '').trim();
      if (v === 'off') return '';
      return /^https?:/.test(v) ? v : DRIVE_DEFAULT;
    } catch (_) { return DRIVE_DEFAULT; }
  }
  function say(cls, html) { $('drive').className = 'drive ' + cls; $('drive').innerHTML = html; }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const toB64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.readAsDataURL(blob); });
  let driveKinds = null;   // 저장 창구가 입금표를 아는지 (예전 코드면 명세표 폴더에 섞이므로 안 보냄)

  async function saveDrive(canvas) {
    const url = driveUrl();
    if (!url) { say('', '드라이브 저장이 꺼져 있어요 (서류 전환 화면 [드라이브 연결])'); return; }
    say('', '드라이브에 저장하는 중…');
    try {
      if (!driveKinds) {
        const h = await fetch(url).then(r => r.json());
        driveKinds = h.kinds || [];
      }
      if (!driveKinds.includes('입금표')) {
        driveKinds = null;
        say('err', '드라이브 저장 창구 코드를 새로 배포해야 입금표를 저장할 수 있어요 (드라이브_저장창구.gs)');
        return;
      }
      canvas = canvas || await capture();
      const png = await new Promise(ok => canvas.toBlob(ok, 'image/png'));
      const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      const w = 170, h = w * canvas.height / canvas.width;
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 20, 20, w, h);
      const name = baseName();
      const ymd = $('date').value.replace(/-/g, '');
      const partner = $('to').value.trim() || '거래처미상';
      const files = [
        { kind: '입금표', partner, ymd, name: name + '.png', mime: 'image/png', data: await toB64(png) },
        { kind: '입금표', partner, ymd, name: name + '.pdf', mime: 'application/pdf', data: await toB64(pdf.output('blob')) },
      ];
      const j = await fetch(url, { method: 'POST', body: JSON.stringify({ files }) }).then(r => r.json());
      if (!j.ok) throw new Error(j.error || '저장 실패');
      const m = j.made[0];
      say('ok', `드라이브 저장됨 · ${esc(m.path || m.folder)}<br><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(name)}</a> (PNG·PDF)`);
    } catch (e) {
      say('err', '드라이브 저장 실패: ' + esc(e.message || e));
    }
  }
</script>
